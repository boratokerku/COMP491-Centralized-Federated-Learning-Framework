# Run config for local simulation on the tabular dataset (UCI Bank Marketing).
# Validated by cfl.coordinator.config.RunConfig; unknown keys are rejected.
run:
  name: sim-tabular-fedavg
  seed: 42
  mode: simulation          # simulation | distributed

task:
  name: tabular             # tabular | text
  data_dir: data/tabular    # relative to the repository root; raw data is never committed
  num_clients: 4
  partition: iid

strategy:
  name: fedavg              # fedavg | fedprox
  # mu: 0.01                # required for fedprox, not allowed for fedavg

rounds:
  num_rounds: 20
  client_fraction: 1.0      # random subset of eligible clients per round (seeded)
  min_participants: 3
  round_deadline_s: 120
  max_num_samples: 10000    # reject updates that report more samples than any client holds

client:
  local_epochs: 1
  batch_size: 64
  learning_rate: 0.003
  # Chosen by the grid search in planning/data.md (results/tabular_tuning/). "yes" is 11.3% of
  # the rows (negatives / positives = 7.9); the weight 5.0 scored better F1 than 7.9. Fixed for all clients.
  class_weights: [1.0, 5.0]
