[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfl"
version = "0.1.0"
description = "Centralized cross-silo federated learning framework (COMP491)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "safetensors>=0.4",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
image = ["medmnist>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/cfl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
