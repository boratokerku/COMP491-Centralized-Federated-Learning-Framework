# Builds the server and client images and publishes them to GitHub Container Registry.
# A version tag (git tag v0.1.0 && git push --tags) publishes :0.1.0 and :latest; the image
# digests are printed in the job summary so clients can pin them. The client image is also
# attached as a `docker save` archive for sites without registry access.
name: images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cfl-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CFL_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - run: echo "cfl-${{ matrix.target }} digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      - if: matrix.target == 'client'
        run: |
          image="ghcr.io/${{ github.repository_owner }}/cfl-client@${{ steps.build.outputs.digest }}"
          docker pull "$image"
          docker save "$image" | gzip -9 > cfl-client-${{ steps.version.outputs.value }}.tar.gz
          sha256sum cfl-client-*.tar.gz > cfl-client-${{ steps.version.outputs.value }}.tar.gz.sha256
      - if: matrix.target == 'client'
        uses: actions/upload-artifact@v4
        with:
          name: cfl-client-image
          path: cfl-client-*.tar.gz*
