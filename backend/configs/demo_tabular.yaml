# Run config for a distributed demo on the tabular dataset: short rounds, quorum of 2 so a dropout does not fail the round.
# Validated by cfl.coordinator.config.RunConfig; unknown keys are rejected.
run:
  name: demo-tabular-fedavg
  seed: 42
  mode: distributed         # simulation | distributed

task:
  name: tabular             # tabular | text
  data_dir: data/tabular    # relative to the repository root; raw data is never committed
  num_clients: 4
  partition: iid

strategy:
  name: fedavg              # fedavg | fedprox
  # mu: 0.01                # required for fedprox, not allowed for fedavg

rounds:
  num_rounds: 10
  client_fraction: 1.0      # random subset of eligible clients per round (seeded)
  min_participants: 2
  round_deadline_s: 90 
  max_num_samples: 10000    # reject updates that report more samples than any client holds

client:
  local_epochs: 1
  batch_size: 64
  learning_rate: 0.001
  class_weights: [1.0, 7.9] # ~ negatives / positives (11.3% "yes"); fixed for all clients
